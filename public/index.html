<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAQnet</title>
<meta name="description" content="SAQnet: проверка ссылок и сообщений на фишинг / Фишингке қарсы сілтемелер мен хабарламаларды тексеру">
<link rel="icon" href="mark.png">
<style>
:root{--bg:#fff;--ink:#0a1a3f;--navy:#0b1f4d;--navy2:#1a3a80;--ln:#d5dcec;--sf:#f3f6fc;--mu:#4d5c7d;--ok:#0f7a3a;--wa:#965900;--da:#b3261e}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--navy2)}
:focus-visible{outline:3px solid var(--navy2);outline-offset:2px}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:3px solid var(--navy)}
header .w{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--navy);text-decoration:none;margin-right:auto}
.brand img{height:40px;width:auto;border-radius:6px}
nav{display:flex;gap:18px}
nav a{color:var(--navy);text-decoration:none;font-size:15px;font-weight:600}
nav a:hover{text-decoration:underline}
.lang{display:flex;border:2px solid var(--navy);border-radius:6px;overflow:hidden}
.lang button{background:#fff;border:0;color:var(--navy);padding:5px 11px;cursor:pointer;font:inherit;font-size:14px;font-weight:700}
.lang button[aria-pressed=true]{background:var(--navy);color:#fff}
h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:0 0 14px;max-width:17em;letter-spacing:-.02em;color:var(--navy)}
h2{font-size:28px;margin:0 0 8px;color:var(--navy);letter-spacing:-.01em}
h3{color:var(--navy)}
.hero{padding:48px 0 40px}
.sub{color:var(--mu);max-width:42em;margin:0 0 24px}
section{padding:44px 0;border-top:1px solid var(--ln)}
.hero{border:0}
.box{border:2px solid var(--navy);border-radius:8px;background:#fff;overflow:hidden}
.tabs{display:flex;background:var(--sf);border-bottom:2px solid var(--navy)}
.tabs button{flex:1;background:none;border:0;padding:13px 10px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff}
.pane{padding:20px}
.pane[hidden]{display:none}
form.chk{display:flex;gap:10px;flex-wrap:wrap}
input,textarea{background:#fff;border:2px solid var(--ln);border-radius:6px;color:var(--ink);font:inherit;padding:11px 13px;width:100%}
input:focus,textarea:focus{border-color:var(--navy);outline:none}
form.chk input{flex:1 1 280px;width:auto}
textarea{min-height:130px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:2px solid var(--navy);border-radius:6px;padding:11px 24px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--navy2);border-color:var(--navy2)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.ghost:hover{background:var(--sf)}
.priv{color:var(--mu);font-size:14px;margin:8px 0 12px}
.res{margin-top:22px;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--mu);border-radius:6px;padding:20px 22px}
.res.ok{border-left-color:var(--ok)}.res.warn{border-left-color:var(--wa)}.res.danger{border-left-color:var(--da)}
.res h3{margin:0;font-size:22px}
.res.ok h3{color:var(--ok)}.res.warn h3{color:var(--wa)}.res.danger h3{color:var(--da)}
.host{color:var(--mu);word-break:break-all;margin:2px 0 12px}
.res ul{margin:0 0 14px;padding-left:20px}
.ai{border-top:1px solid var(--ln);padding-top:12px;margin-bottom:12px}
.res small{color:var(--mu);display:block}
.src{border-top:1px solid var(--ln);padding-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:14px}
.note{color:var(--mu);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.chip{background:#fff;border:2px solid var(--navy);color:var(--navy);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);color:#fff}
.find{max-width:420px}
.cnt{color:var(--mu);font-size:14px;margin:10px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;margin-top:16px}
.card{border:1px solid var(--ln);border-top:4px solid var(--navy);border-radius:6px;padding:16px 18px;background:#fff}
.card h3{margin:0 0 4px;font-size:17px}
.tag{color:var(--mu);font-size:13px;margin:0 0 10px}
.msg{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--navy);background:var(--sf);word-break:break-word}
.card ul{margin:0;padding-left:18px;color:var(--mu);font-size:15px}
.quiz{margin-top:20px;max-width:660px}
.quiz .msg{font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.fb{padding:12px 14px;border-radius:6px;border:2px solid var(--ln);margin-bottom:14px}
.fb.good{border-color:var(--ok)}.fb.bad{border-color:var(--da)}
.pg{color:var(--mu);font-size:14px}
.news{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:12px}
.news li{border:1px solid var(--ln);border-left:4px solid var(--navy);border-radius:6px;padding:12px 16px}
.news a{font-weight:600;text-decoration:none}
.news a:hover{text-decoration:underline}
.news small{display:block;color:var(--mu)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px}
.num{border:2px solid var(--navy);border-radius:8px;padding:16px 18px}
.num a.n{display:block;font-size:38px;font-weight:800;color:var(--navy);text-decoration:none;line-height:1.1}
.num h3{margin:6px 0 4px;font-size:17px}
.num p{margin:0;color:var(--mu);font-size:14px}
.banks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.banks a{display:block;text-decoration:none;border:1px solid var(--ln);border-radius:6px;padding:10px 12px;color:var(--ink)}
.banks a:hover{border-color:var(--navy)}
.banks b{display:block;font-size:20px;color:var(--navy)}
ol.steps{margin:14px 0 0;padding-left:22px;max-width:46em}
ol.steps li{margin-bottom:10px;padding-left:6px}
form.rep{display:grid;gap:12px;max-width:560px;margin-top:20px}
form.rep label{display:grid;gap:6px;color:var(--mu);font-size:14px}
.msgbox{min-height:24px}
footer{background:var(--navy);color:#fff;padding:26px 0;font-size:14px}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{letter-spacing:.04em}
@media(max-width:820px){nav{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="w">
  <a class="brand" href="#top"><img src="mark.png" alt=""><span>SAQnet</span></a>
  <nav aria-label="menu">
    <a href="#learn" data-i="nLearn"></a><a href="#quiz" data-i="nQuiz"></a><a href="#news" data-i="nNews"></a><a href="#help" data-i="nHelp"></a><a href="#report" data-i="nRep"></a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button data-l="ru" aria-pressed="true">RU</button><button data-l="kk" aria-pressed="false">ҚАЗ</button>
  </div>
</div></header>

<main id="top">
<div class="w">
  <div class="hero">
    <h1 data-i="h1"></h1>
    <p class="sub" data-i="sub"></p>
    <div class="box">
      <div class="tabs" role="tablist">
        <button role="tab" id="tL" aria-selected="true" data-i="tabL"></button>
        <button role="tab" id="tM" aria-selected="false" data-i="tabM"></button>
      </div>
      <div class="pane" id="pL" role="tabpanel">
        <form class="chk" id="chk" novalidate>
          <input id="u" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="2000" data-ph="ph" aria-label="URL">
          <button class="btn" id="go" type="submit"></button>
        </form>
      </div>
      <div class="pane" id="pM" role="tabpanel" hidden>
        <form id="msgf" novalidate>
          <textarea id="mt" maxlength="3000" data-ph="phM" aria-label="Message"></textarea>
          <p class="priv" data-i="priv"></p>
          <button class="btn" id="gm" type="submit"></button>
        </form>
      </div>
    </div>
    <div id="res" aria-live="polite"></div>
  </div>

  <section id="learn">
    <h2 data-i="hLearn"></h2>
    <p class="sub" data-i="sLearn"></p>
    <input class="find" id="fq" type="search" data-ph="find" aria-label="Search" maxlength="60">
    <div class="chips" id="chips" role="group"></div>
    <p class="cnt" id="cnt" aria-live="polite"></p>
    <div class="grid" id="ex"></div>
  </section>

  <section id="quiz">
    <h2 data-i="hQuiz"></h2>
    <div class="quiz" id="qz" aria-live="polite"></div>
  </section>

  <section id="news">
    <h2 data-i="hNews"></h2>
    <p class="sub" data-i="sNews"></p>
    <p class="note" id="nnote"></p>
    <ul class="news" id="nw"></ul>
  </section>

  <section id="help">
    <h2 data-i="hHelp"></h2>
    <p class="sub" data-i="sHelp"></p>
    <div class="nums" id="nums"></div>
    <h3 data-i="bankH" style="margin-top:28px"></h3>
    <p class="note" data-i="bankN"></p>
    <div class="banks" id="banks"></div>
    <h3 data-i="stepsH" style="margin-top:28px"></h3>
    <ol class="steps" id="st"></ol>
  </section>

  <section id="report">
    <h2 data-i="hRep"></h2>
    <p class="sub" data-i="sRep"></p>
    <form class="rep" id="rep" novalidate>
      <label><span data-i="fUrl"></span><input id="ru" maxlength="500"></label>
      <label><span data-i="fTxt"></span><textarea id="rt" maxlength="2000"></textarea></label>
      <label><span data-i="fMail"></span><input id="rc" type="email" maxlength="200"></label>
      <div><button class="btn" id="rb" type="submit" data-i="send"></button></div>
      <div class="msgbox" id="rm" aria-live="polite"></div>
    </form>
  </section>
</div>
</main>

<footer><div class="w"><b>TURSYNALY DULAT 2026</b><span data-i="disc"></span></div></footer>

['Вы сами оплатили покупку в приложении, и банк прислал SMS с кодом подтверждения.','Сіз қосымшада сатып алуды өзіңіз төледіңіз, банк растау коды бар SMS жіберді.',false,'Операцию начали вы. Главное: этот код никому нельзя называть.','Операцияны өзіңіз бастадыңыз. Басты ереже: бұл кодты ешкімге айтуға болмайды.'],
['«Казпочта: посылка ждёт. Доплатите 480 ₸: kazpost-track.click»','«Қазпошта: сәлемдеме күтіп тұр. 480 ₸ қосымша төлеңіз: kazpost-track.click»',true,'Домен не post.kz, а мелкая сумма нужна, чтобы получить данные карты.','Домен post.kz емес, ал шағын сома карта деректерін алу үшін керек.']
];
const ST=[
['Сразу позвоните в банк по номеру на обратной стороне карты и заблокируйте карту.','Дереу картаның артындағы нөмір арқылы банкке қоңырау шалып, картаны бұғаттаңыз.'],
['Смените пароли от почты и важных сервисов, начните с почты. Включите двухфакторную защиту.','Поштаның және маңызды қызметтердің құпиясөздерін ауыстырыңыз, поштадан бастаңыз. Екі факторлы қорғауды қосыңыз.'],
['Завершите чужие сеансы: в настройках аккаунта выберите выход со всех устройств.','Бөтен сеанстарды аяқтаңыз: аккаунт баптауларынан барлық құрылғыдан шығуды таңдаңыз.'],
['Не платите «за возврат денег» и не называйте новые коды: так мошенники обманывают повторно.','«Ақшаны қайтару үшін» төлемеңіз және жаңа кодтарды айтпаңыз: алаяқтар осылай қайта алдайды.'],
['Сохраните скриншоты, номера и ссылки. Подайте заявление в полицию (102 или qamqor.gov.kz) и сообщите нам через форму ниже.','Скриншоттарды, нөмірлер мен сілтемелерді сақтаңыз. Полицияға өтініш беріңіз (102 немесе qamqor.gov.kz) және төмендегі форма арқылы бізге жазыңыз.']
];
const BK=[['Kaspi','9999'],['Halyk','7111'],['ForteBank','7575'],['Jusan','7711'],['Bereke Bank','5030'],['ЦентрКредит','505'],['Home Credit','7979']];
const NUMS=[['102','cPol','cPolD'],['1477','cNb','cNbD'],['111','c111','c111D']];

const i=()=>L==='ru'?0:1;
const t=(k,v)=>{let s=T[k][i()];for(const x in v||{})s=s.replace('{'+x+'}',v[x]);return s};
let last=null,mode='L',cat='all',qi=0,score=0,ans=null,newsData=null;

function setMode(m){
  mode=m;$('#tL').setAttribute('aria-selected',m==='L');$('#tM').setAttribute('aria-selected',m==='M');
  $('#pL').hidden=m!=='L';$('#pM').hidden=m!=='M';
}
$('#tL').onclick=()=>setMode('L');$('#tM').onclick=()=>setMode('M');

function render(){
  document.documentElement.lang=L==='kk'?'kk':'ru';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  $('#go').textContent=t('btn');$('#gm').textContent=t('btn');
  renderChips();renderEx();
  const st=$('#st');st.replaceChildren();ST.forEach(s=>st.append(el('li',0,s[i()])));
  const nm=$('#nums');nm.replaceChildren();
  NUMS.forEach(n=>{const d=el('div','num'),a=el('a','n',n[0]);a.href='tel:'+n[0];d.append(a,el('h3',0,t(n[1])),el('p',0,t(n[2])));nm.append(d)});
  const bk=$('#banks');bk.replaceChildren();
  BK.forEach(b=>{const a=el('a');a.href='tel:'+b[1];a.append(el('b',0,b[1]),el('span',0,b[0]));bk.append(a)});
  showRes();showQ();loadNews();
}

function renderChips(){
  const c=$('#chips');c.replaceChildren();
  ['all',...CATS].forEach(k=>{const b=el('button','chip',t(k==='all'?'all':'c'+k));b.setAttribute('aria-pressed',cat===k);
    b.onclick=()=>{cat=k;renderChips();renderEx()};c.append(b)});
}
function renderEx(){
  const q=$('#fq').value.trim().toLowerCase(),g=$('#ex');g.replaceChildren();let n=0;
  EX.forEach(x=>{
    if(cat!=='all'&&x[0]!==cat)return;
    const hay=(x[1]+' '+x[2]+' '+x[3]+' '+x[4]).toLowerCase();
    if(q&&!hay.includes(q))return;
    n++;const c=el('div','card');
    c.append(el('h3',0,x[1+i()]),el('p','tag',t('c'+x[0])),el('p','msg',x[3+i()]));
    const u=el('ul');x[5+i()].forEach(f=>u.append(el('li',0,f)));c.append(u);g.append(c);
  });
  $('#cnt').textContent=n?t('found',{n}):t('empty');
}
$('#fq').addEventListener('input',renderEx);

function stat(v){return(typeof v==='string')?t(v==='ok'?'done':v):t('vtS',{m:v.m,s:v.s})}
function showRes(){
  const out=$('#res');out.replaceChildren();if(!last)return;
  if(last.err){out.append(el('p','note',t(last.err)));return}
  const p=el('div','res '+last.level);
  p.append(el('h3',0,t(last.level)));
  if(last.host)p.append(el('p','host',last.host));
  const u=el('ul');
  if(last.signals.length)last.signals.forEach(s=>u.append(el('li',0,t(s.id,{v:s.v||''}))));else u.append(el('li',0,t(last.kind==='M'?'noneM':'none')));
  p.append(u);
  if(last.links&&last.links.length){p.append(el('small',0,t('linksF')));
    const l=el('ul');last.links.forEach(x=>l.append(el('li',0,x.host+': '+t(x.level))));p.append(l)}
  if(last.level==='ok')p.append(el('p','note',t('okNote')));
  if(last.ai){const a=el('div','ai');a.append(el('small',0,t('sAi')),el('span',0,last.ai));p.append(a)}
  const s=el('div','src');
  [[t('sLocal'),t('done')],['Google Safe Browsing',stat(last.sources.gsb)],['VirusTotal',stat(last.sources.vt)],[t('sAi'),stat(last.sources.ai)]].forEach(r=>{
    const d=el('div');d.append(el('small',0,r[0]),el('span',0,r[1]));s.append(d)});
  p.append(s);out.append(p);
}
async function run(url,body,btn,bad,kind){
  btn.disabled=true;btn.textContent=t('load');
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    last=r.status===400?{err:bad}:r.status===429?{err:'eRate'}:r.ok?await r.json():{err:'eNet'};
    last.kind=kind;
  }catch(x){last={err:'eNet'}}
  btn.disabled=false;btn.textContent=t('btn');showRes();
}
$('#chk').addEventListener('submit',e=>{e.preventDefault();const v=$('#u').value.trim();if(v)run('/api/check',{url:v,lang:L},$('#go'),'eUrl','L')});
$('#msgf').addEventListener('submit',e=>{e.preventDefault();const v=$('#mt').value.trim();
  if(v.length<5){last={err:'eShort'};showRes();return}
  run('/api/message',{text:v,lang:L},$('#gm'),'eShort','M')});

function showQ(){
  const z=$('#qz');z.replaceChildren();
  if(qi>=Q.length){z.append(el('p',0,t('score',{s:score,n:Q.length})));
    const b=el('button','btn',t('again'));b.onclick=()=>{qi=0;score=0;ans=null;showQ()};z.append(b);return}
  const q=Q[qi];
  z.append(el('div','pg',(qi+1)+' / '+Q.length),el('p','msg',q[i()]));
  if(ans===null){
    const r=el('div','row');
    [[true,'bP'],[false,'bS']].forEach(o=>{const b=el('button','btn ghost',t(o[1]));
      b.onclick=()=>{ans=o[0];if(ans===q[2])score++;showQ()};r.append(b)});
    z.append(r);
  }else{
    const ok=ans===q[2];
    z.append(el('div','fb '+(ok?'good':'bad'),t(ok?'good':'bad')+q[3+i()]));
    const b=el('button','btn',t('next'));b.onclick=()=>{qi++;ans=null;showQ()};z.append(b);
  }
}

async function loadNews(){
  const nw=$('#nw'),nn=$('#nnote');nw.replaceChildren();nn.textContent=t('nLoad');
  let d=null;
  try{const r=await fetch('/api/news?lang='+L);if(r.ok)d=await r.json()}catch(e){}
  nw.replaceChildren();
  if(!d||!d.items){nn.textContent=t('nFb');return}
  nn.textContent=t(d.live?'nLive':'nFb');
  d.items.forEach(x=>{
    const li=el('li'),a=el('a',0,typeof x.t==='string'?x.t:x.t[L]);
    if(/^https?:\/\//.test(x.u)){a.href=x.u;a.target='_blank';a.rel='noopener noreferrer'}
    li.append(a,el('small',0,[x.s,x.d].filter(Boolean).join(' · ')));nw.append(li);
  });
}

$('#rep').addEventListener('submit',async e=>{
  e.preventDefault();const m=$('#rm'),u=$('#ru').value.trim(),x=$('#rt').value.trim();
  if(!u&&!x){m.textContent=t('eEmpty');return}
  const b=$('#rb');b.disabled=true;
  try{
    const r=await fetch('/api/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u,text:x,contact:$('#rc').value.trim()})});
    m.textContent=r.ok?t('sent'):t(r.status===429?'eRate':'eNet');
    if(r.ok)e.target.reset();
  }catch(x){m.textContent=t('eNet')}
  b.disabled=false;
});

document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){}render()});
render();
</script>
</body>
</html>
